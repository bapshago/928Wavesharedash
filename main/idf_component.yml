dependencies:
  idf: ">=5.5.0"
  # Waveshare board support: MIPI-DSI 800x800 round panel, GT911-compatible touch,
  # backlight, and the LVGL port. Pinned to the version Waveshare's examples use.
  waveshare/esp32_p4_wifi6_touch_lcd_xc: "3.0.1"
  # LVGL 9.6 moved its public headers and warns on the old paths, which
  # esp_lvgl_adapter still uses; with -Werror (ESP-IDF 6.x) that fails the build.
  lvgl/lvgl:
    version: "~9.5.0"
    public: true
